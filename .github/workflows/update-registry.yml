name: Refresh verified-source chain registry
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-chains.cjs'
      - 'registry-core.js'
      - 'chain-taxonomy.js'
      - 'scripts/test-taxonomy.cjs'
      - 'chain-logos.js'
      - '.github/workflows/update-registry.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-chain-registry
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pull and validate source data
        run: node scripts/update-chains.cjs
      - name: Check JavaScript syntax and taxonomy integrity
        run: |
          node --check app.js
          node --check chain-taxonomy.js
          node --check registry-core.js
          node scripts/test-taxonomy.cjs
      - name: Save generated snapshot to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp registry-snapshot.js /tmp/chainscope-registry-snapshot.js
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            cp /tmp/chainscope-registry-snapshot.js registry-snapshot.js
            git add registry-snapshot.js
            if git diff --cached --quiet; then
              echo "Registry snapshot already up to date."
              exit 0
            fi
            git commit -m "data: refresh 600-chain snapshot"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update, retrying (attempt $attempt)."
            sleep 2
          done
          echo "Unable to publish snapshot after retries."
          exit 1
